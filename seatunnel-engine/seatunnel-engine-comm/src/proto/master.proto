syntax = "proto3";

package seatunnel.engine.v1;

// Master service: workers and clients talk to the master
service MasterService {
  rpc RegisterWorker(WorkerRegistration) returns (WorkerRegistrationResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportTaskStatus(TaskStatusReport) returns (Empty);
  rpc ReportCheckpoint(CheckpointReport) returns (Empty);
  rpc UnregisterWorker(UnregisterWorkerRequest) returns (Empty);
  // Failover support ------------------------------------------------------
  // Fetch the newest checkpoint bytes for a task from the master-backed
  // shared checkpoint store (storage type = master).
  rpc FetchCheckpoint(FetchCheckpointRequest) returns (FetchCheckpointResponse);
}

// Raft consensus transport between master/hybrid nodes (Stage-3 HA:
// the coordinator state machine is replicated through this service).
service RaftService {
  rpc Vote(RaftVoteRequest) returns (RaftVoteResponse);
  rpc AppendEntries(RaftAppendRequest) returns (RaftAppendResponse);
  // One-shot full snapshot install (snapshots are small JSON).
  rpc InstallSnapshot(RaftSnapshotRequest) returns (RaftSnapshotResponse);
}

// Raft RPC payloads are serialized openraft messages (JSON in bytes
// fields); the transport stays versioned by proto, the payloads by serde.
message RaftVoteRequest { bytes payload = 1; }
message RaftVoteResponse { bytes payload = 1; }
message RaftAppendRequest { bytes payload = 1; }
message RaftAppendResponse { bytes payload = 1; }
message RaftSnapshotRequest { bytes payload = 1; }
message RaftSnapshotResponse { bytes payload = 1; }

service ClientService {
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc CancelJob(CancelJobRequest) returns (Empty);
  rpc GetJobStatus(JobStatusRequest) returns (JobStatus);
  rpc GetClusterInfo(Empty) returns (ClusterInfo);
  rpc ListJobs(Empty) returns (JobList);
  // Checkpoint history (ids + sizes, no payload bytes) for the web UI.
  rpc GetJobCheckpoints(JobStatusRequest) returns (JobCheckpointHistory);
  // Per-task logs (lifecycle events + sampled data) for the web UI.
  rpc GetJobLogs(JobStatusRequest) returns (JobLogs);
}

message Empty {}

// --- Worker Registration ---
message WorkerRegistration {
  string worker_id = 1;
  string address = 2;
  string version = 3;
  map<string, string> resources = 4;
  int64 heartbeat_interval_ms = 5;
  // Tasks this worker is currently executing (failover fencing: the
  // master marks them Running for this worker so other workers do not
  // take them over while it reconnects).
  repeated string running_task_ids = 6;
  // Task slot budget advertised by the worker (0 = legacy/unlimited).
  uint32 slots = 7;
}

message WorkerRegistrationResponse {
  bool success = 1;
  string message = 2;
  string leader_address = 3;
  // Fencing term of the responding master. Workers ignore instructions
  // (dispatch/cancel/preempt) from a master whose term is lower than the
  // highest term they have already seen, so a deposed master cannot
  // disturb tasks owned by its successor.
  uint64 term = 4;
}

message UnregisterWorkerRequest {
  string worker_id = 1;
  string address = 2;
}

// --- Heartbeat ---
message HeartbeatRequest {
  string worker_id = 1;
  string address = 2;
  int64 timestamp = 3;
  repeated TaskHeartbeat tasks = 4;
  // Fencing term the worker currently operates under (highest seen).
  uint64 term = 5;
  // Long-poll hint (ms): the master may hold the request until dispatchable
  // work appears. 0 = return immediately (legacy behavior).
  int64 wait_ms = 6;
}

message HeartbeatResponse {
  string worker_id = 1;
  int64 next_interval_ms = 2;
  repeated TaskDescriptor pending_tasks = 3;
  // Jobs the master has cancelled; workers must stop their local tasks for them.
  repeated string cancel_jobs = 4;
  // Tasks this worker still reports as running but which the master has
  // reassigned elsewhere (worker-failover fencing): stop them locally to
  // avoid duplicate execution.
  repeated string preempted_task_ids = 5;
  // Fencing term of this master (see WorkerRegistrationResponse.term).
  uint64 term = 6;
  // Address of the currently active master; empty when this node is active.
  // Workers may use it to retry against the right master.
  string leader_hint = 7;
  // Coordinated checkpoint barriers to fire on this worker's tasks (the
  // master is the checkpoint driver; ids are master-assigned and never
  // rewind across failover).
  repeated CheckpointTrigger checkpoint_triggers = 8;
  // Resolutions of coordinated checkpoints: run 2PC phase 2 (sink commit)
  // on completed, unwind on aborted.
  repeated CheckpointResolution checkpoint_resolutions = 9;
}

/// Master → worker: fire the barrier for this checkpoint on one task.
message CheckpointTrigger {
  string task_id = 1;
  uint64 checkpoint_id = 2;
}

/// Master → worker: a coordinated checkpoint's resolution for one task.
message CheckpointResolution {
  string task_id = 1;
  uint64 checkpoint_id = 2;
  // true = durably collected, run phase 2 (committer commit + reader
  // offset commit); false = aborted, unwind prepared commits.
  bool completed = 3;
}

message TaskHeartbeat {
  string task_id = 1;
  TaskState state = 2;
  int64 processed_records = 3;
  int64 last_heartbeat_time = 4;
  int64 memory_usage = 5;
  // Epoch-ms of the most recent record (0 = none yet): the task
  // liveness/latency signal for streaming jobs.
  int64 last_record_at = 6;
  // Incremental task log lines (rendered) shipped since the previous
  // heartbeat; the master retains a bounded tail per task.
  repeated string logs = 7;
  // Most recent completed checkpoint (id 0 = none yet) and its state
  // size — visible for every storage backend, unlike payload bytes.
  int64 last_checkpoint_id = 8;
  int64 last_checkpoint_size_bytes = 9;
}

// --- Task Status ---
message TaskStatusReport {
  string worker_id = 1;
  string task_id = 2;
  string job_id = 3;
  TaskState state = 4;
  int64 timestamp = 5;
  int64 processed_records = 6;
  string error_message = 7;
  // Fencing term the report was produced under.
  uint64 term = 8;
}

// --- Checkpoint ---
message CheckpointReport {
  string job_id = 1;
  string task_id = 2;
  int64 checkpoint_id = 3;
  int64 timestamp = 4;
  bytes checkpoint_data = 5;
  bool success = 6;
  // Fencing term the report was produced under.
  uint64 term = 7;
  // 2PC phase (default PREPARE keeps old senders on the prepare path):
  // PREPARE — phase 1 done (sink flushed, source state captured); the
  // master collects these and resolves the checkpoint.
  CheckpointPhase phase = 8;
}

enum CheckpointPhase {
  // Barrier cut finished; awaiting the coordinator's resolution.
  CHECKPOINT_PREPARE = 0;
  // Phase 2 (sink commit) finished after a Completed resolution.
  CHECKPOINT_PHASE2_DONE = 1;
}

// --- Client API ---
message SubmitJobRequest {
  string job_id = 1;
  bytes job_config = 2;
  int32 parallelism = 3;
  string user = 4;
  string job_name = 5;
}

message SubmitJobResponse {
  bool success = 1;
  string job_id = 2;
  string message = 3;
}

message CancelJobRequest {
  string job_id = 1;
}

message JobStatusRequest {
  string job_id = 1;
}

message JobStatus {
  string job_id = 1;
  JobState state = 2;
  string job_name = 3;
  int64 start_time = 4;
  int64 end_time = 5;
  string error_message = 6;
  repeated TaskStatusInfo tasks = 7;
  int64 checkpoint_interval_ms = 8;
  int64 checkpoints_completed = 9;
}

message TaskStatusInfo {
  string task_id = 1;
  string stage_id = 2;
  TaskState state = 3;
  int64 processed_records = 4;
  int64 start_time = 5;
  int64 end_time = 6;
  // Epoch-ms of the most recent record (0 = none yet).
  int64 last_record_at = 7;
  // Worker currently (or last known) executing this task.
  string worker_id = 8;
}

message JobList {
  repeated JobSummary jobs = 1;
}

message JobSummary {
  string job_id = 1;
  string job_name = 2;
  JobState state = 3;
  int64 start_time = 4;
  int64 end_time = 5;
}

// --- Checkpoint history (web UI) ---
message JobCheckpointHistory {
  string job_id = 1;
  int64 checkpoint_interval_ms = 2;
  int64 checkpoints_completed = 3;
  repeated TaskCheckpointHistory tasks = 4;
}

message TaskCheckpointHistory {
  string task_id = 1;
  repeated CheckpointEntry entries = 2;
}

// --- Task logs (web UI) ---
message JobLogs {
  string job_id = 1;
  repeated TaskLogs tasks = 2;
}

message TaskLogs {
  string task_id = 1;
  repeated string lines = 2;
}

message CheckpointEntry {
  int64 checkpoint_id = 1;
  int64 size_bytes = 2;
}

message ClusterInfo {
  repeated WorkerInfo workers = 1;
  int32 total_tasks = 2;
  int32 running_tasks = 3;
  int32 available_workers = 4;
  string leader_id = 5;
  // Fencing term of the responding master.
  uint64 term = 6;
  // Advertised address of the active master.
  string leader_address = 7;
  // Role of the responding node: master | worker | hybrid.
  string role = 8;
}

message WorkerInfo {
  string worker_id = 1;
  string address = 2;
  int64 last_heartbeat = 3;
  map<string, string> resources = 4;
  int32 running_tasks = 5;
  // Advertised slot budget (0 = legacy/unlimited).
  uint32 slots = 6;
}

// --- Task Assignment ---
message TaskDescriptor {
  string task_id = 1;
  string job_id = 2;
  string stage_id = 3;
  string task_name = 4;
  int32 task_index = 5;
  string source_config_json = 6;
  string sink_config_json = 7;
  int32 parallelism = 8;
  map<string, string> config = 9;
}

// --- Enums ---
enum TaskState {
  TASK_UNKNOWN = 0;
  TASK_CREATED = 1;
  TASK_RUNNING = 2;
  TASK_COMPLETED = 3;
  TASK_FAILED = 4;
  TASK_CANCELLED = 5;
}

enum JobState {
  JOB_UNKNOWN = 0;
  JOB_CREATED = 1;
  JOB_SCHEDULED = 2;
  JOB_RUNNING = 3;
  JOB_COMPLETED = 4;
  JOB_FAILED = 5;
  JOB_CANCELLED = 6;
}

message FetchCheckpointRequest {
  string job_id = 1;
  string task_id = 2;
}

message FetchCheckpointResponse {
  // Highest checkpoint id available for the task (0 = none).
  int64 checkpoint_id = 1;
  bytes checkpoint_data = 2;
}

