name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.85", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-
      - name: Build
        run: cargo build --all --all-targets
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

  e2e:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Start infrastructure (Kafka + MySQL)
        run: docker compose up -d kafka mysql
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            docker exec seatunnel-rs-mysql-1 mysqladmin ping -uroot -proot && \
            docker exec seatunnel-rs-kafka-1 kafka-broker-api-versions --bootstrap-server localhost:9092 && break
            sleep 2
          done
      - name: Run E2E tests
        run: cargo test -p seatunnel-e2e --test e2e -- --nocapture
