services:
  # ===== Kafka (KRaft mode — no ZooKeeper) =====
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft: one process acts as both broker and controller.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      # Dual listeners: HOST for the host (advertised as localhost),
      # DOCKER for other containers (advertised as kafka).
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29094,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29094
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== MySQL CDC =====
  mysql:
    image: mysql:8.0
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seatunnel
    command:
      - "--binlog-format=row"
      - "--binlog-row-image=full"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=true"
      - "--server-id=1"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 5

  # ===== PostgreSQL CDC =====
  postgres:
    image: postgres:16
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seatunnel
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # ===== TiDB cluster (profile "tidb"): pd + tikv + tidb =====
  # Minimal CDC-capable stack. TiKV advertises host.docker.internal so the
  # TiDB SQL container can reach it through Docker's NAT gateway; workers on
  # the HOST rewrite that host to 127.0.0.1 via the connector's
  # `store-address-rewrite` option (see examples/tidb-cdc-to-kafka.yaml).
  #   PD gRPC -> localhost:2379   TiKV -> localhost:30160   TiDB SQL -> localhost:14000
  tidb-pd:
    image: pingcap/pd:v8.1.0
    profiles: ["tidb"]
    ports:
      - "2379:2379"
    volumes:
      - tidb-pd-data:/data
      - tidb-pd-peer:/peer
    command:
      - "--name=pd"
      - "--data-dir=/data"
      - "--client-urls=http://0.0.0.0:2379"
      - "--advertise-client-urls=http://host.docker.internal:2379"
      - "--peer-urls=http://0.0.0.0:2380"
      - "--advertise-peer-urls=http://tidb-pd:2380"
      - "--initial-cluster=pd=http://tidb-pd:2380"
      - "--log-level=warn"

  tidb-tikv:
    image: pingcap/tikv:v8.1.0
    profiles: ["tidb"]
    ports:
      - "30160:30160"
    depends_on:
      - tidb-pd
    volumes:
      - tidb-tikv-data:/data
    command:
      - "--pd-endpoints=http://tidb-pd:2379"
      - "--addr=0.0.0.0:30160"
      - "--advertise-addr=host.docker.internal:30160"
      - "--status-addr=0.0.0.0:20180"
      - "--data-dir=/data"
      - "-L=debug"

  tidb:
    image: pingcap/tidb:v8.1.0
    profiles: ["tidb"]
    ports:
      - "14000:4000"
    depends_on:
      - tidb-tikv
    command:
      - "--store=tikv"
      - "--path=host.docker.internal:2379"
      - "-P=4000"
      - "--status=10080"
      - "-L=warn"

volumes:
  tidb-tikv-data:
  tidb-pd-data:
  tidb-pd-peer:
