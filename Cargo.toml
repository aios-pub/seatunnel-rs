[workspace]
resolver = "2"
members = [
    "seatunnel-api",
    "seatunnel-engine/seatunnel-engine-core",
    "seatunnel-engine/seatunnel-engine-comm",
    "seatunnel-engine/seatunnel-engine-server",
    "seatunnel-engine/seatunnel-engine-client",
    "seatunnel-config",
    "seatunnel-formats",
    "seatunnel-transforms",
    "seatunnel-cli",
    "seatunnel-macros",
    "seatunnel-web/server",
    "seatunnel-e2e",
    "seatunnel-connectors/seatunnel-connector-common",
    "seatunnel-connectors/seatunnel-connector-kafka",
    "seatunnel-connectors/seatunnel-connector-cdc-base",
    "seatunnel-connectors/seatunnel-connector-cdc-mysql",
    "seatunnel-connectors/seatunnel-connector-cdc-tidb",
    "seatunnel-connectors/seatunnel-connector-cdc-postgres",
    "seatunnel-connectors/seatunnel-connector-jdbc",
    "seatunnel-connectors/seatunnel-connector-redis",
    "seatunnel-connectors/seatunnel-connector-elasticsearch",
    "seatunnel-connectors/seatunnel-connector-rabbitmq",
    "seatunnel-connectors/seatunnel-connector-http",
    "seatunnel-connectors/seatunnel-connector-clickhouse",
    "seatunnel-benchmarks",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
authors = ["SeaTunnel Rust Team <aios.pub@gmail.com>"]
repository = "https://github.com/aios-pub/seatunnel-rs"
homepage = "https://aios.pub/setunnel-rs"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
prost = "0.13"
prost-types = "0.13"

# gRPC
tonic = "0.12"
tonic-build = "0.12"
prost-build = "0.13"

# HTTP / REST
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rust-embed = "8"

# CLI
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = "0.29"

# Logging & Metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono", "local-time"] }
prometheus = "0.13"

# Database
mysql_async = { version = "0.37", features = ["binlog","default-rustls"] }

tokio-postgres = "0.7"
postgres-types = "0.2"

# CDC framework
rustcdc = { version = "0.12", default-features = false, features = ["postgres"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "cluster", "cluster-async"] }

# RabbitMQ (AMQP)
lapin = "4"

# ClickHouse
clickhouse = { version = "0.15", features = ["rustls-tls-ring", "rustls-tls-webpki-roots"] }

# TiDB / TiKV
tikv-client = "0.4"
rdkafka = { version = "0.36", features = ["cmake-build", "libz-static", "ssl", "sasl"] }

# Storage
rust-rocksdb = "0.52"

# Arrow
arrow = "50"
object_store = { version = "0.11", features = ["aws"] }
parquet = "50"

# Avro
avro = "0.2"

# Protobuf
protobuf = "2.28"

# Schema / Type
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = ">=0.4.31, <0.4.40", features = ["serde"] }
chrono-tz = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Testing
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["mysql", "postgres", "kafka"] }

# Raft
# raft = "0.7"  # TODO: check availability
prost-derive = "0.13"

# Utilities
regex = "1"
bytes = "1"
hex = "0.4"
once_cell = "1"
parking_lot = "0.12"
itertools = "0.14"

# DataFusion for SQL transforms
datafusion = "43"
datafusion-expr = "43"

# Workspace members
seatunnel-api = { path = "seatunnel-api" }
seatunnel-engine-core = { path = "seatunnel-engine/seatunnel-engine-core" }
seatunnel-engine-comm = { path = "seatunnel-engine/seatunnel-engine-comm" }
seatunnel-engine-server = { path = "seatunnel-engine/seatunnel-engine-server" }
seatunnel-engine-client = { path = "seatunnel-engine/seatunnel-engine-client" }
seatunnel-config = { path = "seatunnel-config" }
seatunnel-formats = { path = "seatunnel-formats" }
seatunnel-transforms = { path = "seatunnel-transforms" }
seatunnel-cli = { path = "seatunnel-cli" }
seatunnel-macros = { path = "seatunnel-macros" }
seatunnel-web = { path = "seatunnel-web/server" }
seatunnel-connector-common = { path = "seatunnel-connectors/seatunnel-connector-common" }
seatunnel-connector-kafka = { path = "seatunnel-connectors/seatunnel-connector-kafka" }
seatunnel-connector-cdc-base = { path = "seatunnel-connectors/seatunnel-connector-cdc-base" }
seatunnel-connector-cdc-mysql = { path = "seatunnel-connectors/seatunnel-connector-cdc-mysql" }
seatunnel-connector-cdc-tidb = { path = "seatunnel-connectors/seatunnel-connector-cdc-tidb" }
seatunnel-connector-cdc-postgres = { path = "seatunnel-connectors/seatunnel-connector-cdc-postgres" }
seatunnel-connector-jdbc = { path = "seatunnel-connectors/seatunnel-connector-jdbc" }
seatunnel-connector-redis = { path = "seatunnel-connectors/seatunnel-connector-redis" }
seatunnel-connector-elasticsearch = { path = "seatunnel-connectors/seatunnel-connector-elasticsearch" }
seatunnel-connector-rabbitmq = { path = "seatunnel-connectors/seatunnel-connector-rabbitmq" }
seatunnel-connector-http = { path = "seatunnel-connectors/seatunnel-connector-http" }
seatunnel-connector-clickhouse = { path = "seatunnel-connectors/seatunnel-connector-clickhouse" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "warn" }
perf = { level = "warn" }
style = { level = "warn" }
suspicious = { level = "warn" }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
