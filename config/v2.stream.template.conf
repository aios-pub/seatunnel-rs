env {
  job.name = "seatunnel-rust-demo"
  job.mode = "streaming"
  parallelism.default = 4
  checkpoint.interval = 60000
}

source {
  kafka {
    bootstrap.servers = "localhost:9092"
    topic = "seatunnel-source"
    format = "json"
    startup.mode = "earliest"
    group.id = "seatunnel-rust"
  }
}

transform {
  filter {
    rule = "active == true"
  }
}

sink {
  console {
    format = "json"
  }
}
